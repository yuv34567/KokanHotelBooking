<template>
    <lightning-card>
            <div class="slds-m-around_medium">
                <div class="main">
                    <div class="signupbox">
                        <form>
                            <lightning-input type="text" label="Fullname" value={fullNameval} name="Fullname"  onchange={handlesignupinput}></lightning-input>
                            <lightning-input type="password" label="Password" value={password} name="Password" min-length="6" onchange={handlesignupinput}></lightning-input>
                            <lightning-input type="tel" label="Phone" value={phoneval} name="Phone" onchange={handlesignupinput}></lightning-input>
                            <lightning-input type="email" label="Email" value={emailval} name="Email" onchange={handlesignupinput}></lightning-input>
                            <lightning-input type="text" label="Street" value={streetval} name="Street" onchange={handlesignupinput}></lightning-input>
                            <lightning-input type="text" label="State" value={stateval} name="State" onchange={handlesignupinput}></lightning-input>
                            <lightning-input type="text" label="City" value={cityval} name="City" onchange={handlesignupinput}></lightning-input>
                            <lightning-input type="number" label="Pincode" value={pincodeval} name="Pincode" onchange={handlesignupinput}></lightning-input>
                            <div class="btn1">
                                <template if:true={showSubmit}>
                                <lightning-button onclick={handlesignupsubmit} label="Submit" variant="Brand" class="slds-m-around_medium"></lightning-button>
                                </template>
                            </div>
                        </form>
                        <hr></hr>
                        <div class="btn2">
                            <lightning-button onclick={handleHome} label="Home" variant="Brand" class="slds-m-around_medium"></lightning-button>
                            <lightning-button onclick={handleLogin}  label="Login" variant="Success" class="slds-m-around_medium"></lightning-button>
                        </div>
                    </div>
                </div>
            </div>
    </lightning-card>
</template>
