<template>
    <lightning-card>
            <div class="slds-m-around_medium top" >
                <div class="main" style={currentImage}>
                    <div class="loginbox" style={prevImage}>
                        <form>
                            <label class="custom-label">UserName</label>
                            <lightning-input type="text" label="UserName" value={userName} variant="label-hidden"></lightning-input>
                            <label class="custom-label">Password</label>
                            <lightning-input type="password" label="Password" value={password} variant="label-hidden"></lightning-input>
                        </form>
                    </div>
                </div>
            </div>
    </lightning-card>
</template>
